<!doctype html>
<html lang="it" data-titolo="account.pagina">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Accedi · Ufotizio</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script type="module" src="/assets/lingua.js"></script>
</head>
<body>
<header><a class="logo" href="/" data-link="home"><img src="/assets/ufotizio.png" alt=""><span>Ufotizio</span></a><nav class="menu"><a href="/devlog" data-link="devlog" data-testo="nav.devlog">Devlog</a></nav><div id="account"></div></header>
<main>
  <h1 data-testo="account.titolo">Accedi</h1>
  <p data-testo="account.spiegazione">Scrivi la tua email: ti mandiamo un link per entrare, senza password. Se non hai ancora un account, viene creato al primo accesso.</p>
  <form id="login">
    <input id="email" type="email" required placeholder="nome@esempio.it" data-testo-placeholder="account.email" autocomplete="email">
    <button type="submit" data-testo="account.invia">Mandami il link</button>
  </form>
  <p id="status"></p>
</main>
<footer>
  <nav><a href="/" data-link="home" data-testo="nav.giochi">Giochi</a> · <a href="/ciccio-massacro" data-link="ciccio" data-testo="ciccio.nome">Ciccio Massacro</a> · <a href="/gobelino" data-link="gobelino" data-testo="gobelino.nome">Gobelino</a> · <a href="/devlog" data-link="devlog" data-testo="nav.devlog">Devlog</a> · <a href="https://fdamore1984.itch.io">itch.io</a></nav>
  <p data-testo="footer.creato">Giochi creati da fdamore1984 con Claude Code.</p>
</footer>
<script type="module">
// Accesso con link via email (magic link di Supabase): il link riporta qui
// e poi alla pagina da cui si è partiti (?back=).
import { supabase, ready } from "/account/cloud.js";
import { t } from "/assets/lingua.js";
const back = new URLSearchParams(location.search).get("back") || "/";
const target = back.startsWith("/") && !back.startsWith("//") ? back : "/";
const status = document.getElementById("status");
await ready;
const { data } = await supabase.auth.getSession();
if (data.session) {
  location.replace(target);
} else {
  document.getElementById("login").addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = t("account.invio");
    const { error } = await supabase.auth.signInWithOtp({
      email: document.getElementById("email").value,
      options: { emailRedirectTo: location.origin + "/account.html?back=" + encodeURIComponent(target) },
    });
    status.textContent = error ? t("account.errore") + error.message : t("account.fatto");
  });
}
</script>
</body>
</html>
